<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-label="Erlandson Junior — Software Engineer, Full-Stack and Mobile">
  <defs>
    <radialGradient id="ember" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#150800" stop-opacity="1"/>
      <stop offset="55%" stop-color="#150800" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0a0a0c" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect width="1000" height="260" rx="16"/></clipPath>
  </defs>
  <style>
    .sans { font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace; }
    .cur  { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 0%, 55% { opacity: 1; } 56%, 100% { opacity: 0; } }
    .bar  { animation: stretch 3.4s ease-in-out infinite; transform-origin: 64px 0; }
    @keyframes stretch { 0%, 100% { transform: scaleX(1); } 50% { transform: scaleX(2.4); } }
    .tw  { animation: tw 2.8s ease-in-out infinite; }
    .tw2 { animation: tw 2.8s ease-in-out 0.9s infinite; }
    .tw3 { animation: tw 2.8s ease-in-out 1.8s infinite; }
    @keyframes tw { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1000" height="260" fill="#0a0a0c"/>
    <ellipse cx="240" cy="280" rx="460" ry="180" fill="url(#ember)"/>
    <ellipse cx="900" cy="-40" rx="320" ry="140" fill="url(#ember)" opacity="0.6"/>

    <!-- pixel constellation -->
    <g>
      <rect x="880" y="40"  width="14" height="14" fill="#3d1000"/>
      <rect x="894" y="40"  width="14" height="14" fill="#7a2008"/>
      <rect x="908" y="40"  width="14" height="14" fill="#ff4d1c" class="tw"/>
      <rect x="852" y="68"  width="14" height="14" fill="#3d1000"/>
      <rect x="866" y="68"  width="14" height="14" fill="#7a2008"/>
      <rect x="894" y="68"  width="14" height="14" fill="#d93d12"/>
      <rect x="922" y="68"  width="14" height="14" fill="#ff4d1c" opacity="0.2"/>
      <rect x="824" y="96"  width="14" height="14" fill="#7a2008" class="tw2"/>
      <rect x="880" y="96"  width="14" height="14" fill="#ff4d1c"/>
      <rect x="908" y="96"  width="14" height="14" fill="#3d1000"/>
      <rect x="796" y="124" width="14" height="14" fill="#3d1000"/>
      <rect x="838" y="124" width="14" height="14" fill="#d93d12" class="tw3"/>
      <rect x="866" y="124" width="14" height="14" fill="#ff4d1c" opacity="0.2"/>
      <rect x="936" y="124" width="14" height="14" fill="#7a2008"/>
      <rect x="768" y="152" width="14" height="14" fill="#ff4d1c" opacity="0.2"/>
      <rect x="810" y="152" width="14" height="14" fill="#7a2008"/>
      <rect x="894" y="152" width="14" height="14" fill="#f3e2d7" class="tw2"/>
      <rect x="922" y="152" width="14" height="14" fill="#3d1000"/>
    </g>

    <!-- terminal prompt -->
    <text x="64" y="84" class="mono" font-size="15">
      <tspan fill="#ff4d1c">~/erlandsonjr</tspan>
      <tspan fill="#555555"> $</tspan>
      <tspan fill="#888888"> whoami</tspan>
    </text>
    <rect class="cur" x="268" y="71" width="9" height="17" fill="#ff4d1c"/>

    <!-- name -->
    <text x="62" y="146" class="sans" font-size="50" font-weight="800" letter-spacing="1" fill="#ffffff">Erlandson Junior</text>

    <!-- role -->
    <text x="64" y="184" class="mono" font-size="14" letter-spacing="5" fill="#888888">SOFTWARE ENGINEER — FULL-STACK &amp; MOBILE</text>

    <!-- accent bar -->
    <rect x="64" y="206" width="240" height="5" fill="#ff4d1c" opacity="0.2"/>
    <g class="bar"><rect x="64" y="206" width="88" height="5" fill="#ff4d1c"/></g>

    <!-- meta -->
    <text x="936" y="224" text-anchor="end" class="mono" font-size="12" letter-spacing="2" fill="#555555">TERESINA, BR · GMT-3 · WORKS WORLDWIDE</text>

    <rect x="0.5" y="0.5" width="999" height="259" rx="16" fill="none" stroke="#1a1a1e"/>
  </g>
</svg>
