<svg xmlns="http://www.w3.org/2000/svg" width="500" height="150" viewBox="0 0 500 150" role="img" aria-label="AWS Academy Graduate — Cloud Developing · Jun 2026">
  <defs>
    <radialGradient id="ember" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#150800" stop-opacity="1"/>
      <stop offset="55%" stop-color="#150800" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0a0a0c" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect width="500" height="150" rx="14"/></clipPath>
  </defs>
  <style>
    .sans { font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace; }
    .tw { animation: tw 2.8s ease-in-out infinite; }
    @keyframes tw { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="500" height="150" fill="#0a0a0c"/>
    <ellipse cx="70" cy="170" rx="260" ry="110" fill="url(#ember)"/>

    <!-- hex badge -->
    <polygon points="70,33 106,54 106,96 70,117 34,96 34,54" fill="#150800" stroke="#ff4d1c" stroke-width="1.5"/>
    <polygon points="70,43 97,59 97,91 70,107 43,91 43,59" fill="none" stroke="#ff4d1c" stroke-opacity="0.2"/>
    <text x="70" y="80" text-anchor="middle" class="mono" font-size="15" font-weight="700" letter-spacing="1" fill="#f3e2d7">AWS</text>
    <rect x="58" y="88" width="24" height="3" fill="#ff4d1c"/>
    <rect x="102" y="28" width="8" height="8" fill="#ff4d1c"/>

    <!-- text -->
    <text x="134" y="42" class="mono" font-size="11" letter-spacing="3" fill="#888888">AWS ACADEMY GRADUATE</text>
    <text x="133" y="76" class="sans" font-size="21" font-weight="800" fill="#ffffff">Cloud Developing</text>
    <text x="134" y="98" class="mono" font-size="11" letter-spacing="1" fill="#555555">cloud-native development</text>

    <rect x="134" y="110" width="120" height="3" fill="#ff4d1c" opacity="0.2"/>
    <rect x="134" y="110" width="36" height="3" fill="#ff4d1c"/>

    <text x="476" y="128" text-anchor="end" class="mono" font-size="11" letter-spacing="2"><tspan fill="#ff4d1c">JUN 2026</tspan><tspan fill="#555555"> · CREDLY ↗</tspan></text>
    <text x="476" y="36" text-anchor="end" class="mono" font-size="11" letter-spacing="2" fill="#555555">02/04</text>

    <rect x="0.5" y="0.5" width="499" height="149" rx="14" fill="none" stroke="#1a1a1e"/>
  </g>
</svg>
