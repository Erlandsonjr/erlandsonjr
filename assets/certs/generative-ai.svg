<svg xmlns="http://www.w3.org/2000/svg" width="280" height="120" viewBox="0 0 280 120" role="img" aria-label="AWS Academy Graduate — Generative AI · Oct 2025">
  <defs>
    <radialGradient id="ember" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#150800" stop-opacity="1"/>
      <stop offset="55%" stop-color="#150800" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0a0a0c" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect width="280" height="120" rx="12"/></clipPath>
  </defs>
  <style>
    .sans { font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace; }
    .tw { animation: tw 2.8s ease-in-out infinite; }
    @keyframes tw { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="280" height="120" fill="#0a0a0c"/>
    <ellipse cx="40" cy="130" rx="200" ry="70" fill="url(#ember)"/>

    <text x="24" y="50" class="sans" font-size="22" font-weight="800" fill="#ffffff">Generative AI</text>
    <rect x="24" y="64" width="64" height="3" fill="#ff4d1c" opacity="0.2"/>
    <rect x="24" y="64" width="22" height="3" fill="#ff4d1c"/>
    <text x="24" y="94" class="mono" font-size="13" letter-spacing="3" fill="#888888">OCT 2025</text>

    <polygon points="244.0,75.0 253.5,80.5 253.5,91.5 244.0,97.0 234.5,91.5 234.5,80.5" fill="none" stroke="#ff4d1c" stroke-width="1.5"/>

    <rect x="0.5" y="0.5" width="279" height="119" rx="12" fill="none" stroke="#1a1a1e"/>
  </g>
</svg>
